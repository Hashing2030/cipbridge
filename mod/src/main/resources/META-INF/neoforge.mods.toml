modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Hashing2030/cipbridge/issues"

# ── 模组本体 ──
[[mods]]
modId = "cipbridge"
version = "0.1.0"
displayName = "CIP Bridge"
authors = "Hashing2030"
description = '''
A local-only HTTP bridge (127.0.0.1) that lets external AI agents read the
client world (state, block/entity snapshots, block search) and, when explicitly
enabled, run commands through the game itself.
本地 HTTP 桥接模组：让外部 AI 读取玩家所在的世界并（在显式开启后）执行命令。
Read-only by default; write endpoints are gated behind allow_mutations=false.
'''
# ── 依赖（SPEC §5 原文要求）──
[[dependencies.cipbridge]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.247,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.cipbridge]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "CLIENT"
